name: Thinknum
description: >-
  Thinknum is an alternative data platform that collects and structures
  web-sourced datasets to power investment and business intelligence. It tracks
  metrics such as job listings, store locations, product pricing, web traffic,
  app reviews, and social engagement across hundreds of thousands of companies,
  keyed by exchange ticker. The Thinknum Data API (data.thinknum.com) exposes
  these datasets over a token-authenticated REST interface with Query,
  Historical, Company, and Upload endpoints, plus embeddable widgets and an
  official Python client. Backed by 500 Global.
