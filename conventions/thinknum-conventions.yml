  Cross-cutting request/response semantics for the Thinknum Data API, captured
  from the published documentation. REST over HTTPS to data.thinknum.com, JSON
  responses, token auth, a dated API-version header, offset-style pagination, and
  a fixed 20-requests-per-minute rate limit surfaced via HTTP 429. No idempotency
  key contract is documented.
